<title id="t">Ganesan G</title>
<desc id="d">Software engineer. I build backend systems, and the AI that has to live inside them. Role: SDE Intern, Firstsource. Study: B.E. CSE, REC · 2027. Focus: Backends · Agents · Azure. Based: Chennai, India. Principles: Failure is a state: Queues, retries, explicit statuses, workers that can safely run twice. Models propose; code decides: LLMs belong inside systems that can be tested and audited. Own the whole path: Schema, API, client, container, cloud.</desc>
