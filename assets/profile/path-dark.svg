<desc id="d">Path, newest first. 2027: Graduating (upcoming). B.E. Computer Science, Rajalakshmi Engineering College. Oct 2026: First upstream PR merged. django-modern-rest: CSRF header scheme for OpenAPI. Aug 2026: Built Smart Attendance. Face recognition with liveness checks, on GPU. Dec 2025: SDE Intern, Firstsource. LLM agents, agent-to-agent integrations, Azure. 2025: Smart India Hackathon, top 100. National hackathon, Government of India. Apr 2025: Started EduFlow. First full-stack system shipped to Azure. 2023: Began B.E. CSE. Rajalakshmi Engineering College, Chennai.</desc>
