must seek instantly.</tspan></text><text x="312" y="336" class="mono" font-size="11" letter-spacing="1.6" text-anchor="start" fill="#F0A04B">KEY IDEA</text><text x="312" y="362" class="serif" font-size="14.5" fill="#E8E5DE" ><tspan x="312" dy="0">Uploads go onto a queue; a</tspan><tspan x="312" dy="20.59">separate ffmpeg worker</tspan><tspan x="312" dy="20.59">transcodes, retries with backoff</tspan><tspan x="312" dy="20.59">and records each video’s status.</tspan></text><text x="592" y="336" class="mono" font-size="11" letter-spacing="1.6" text-anchor="start" fill="#8B949E">MY PART</text><text x="592" y="362" class="serif" font-size="14.5" fill="#E8E5DE" ><tspan x="592" dy="0">All of it: React web app, Node</tspan><tspan x="592" dy="20.59">API, Kotlin Android client, Azure</tspan><tspan x="592" dy="20.59">DevOps pipeline to App Service.</tspan></text><rect x="32.5" y="454.27" width="67" height="22" rx="11" fill="none" stroke="#30363D"/><text x="66" y="469.27" class="mono" font-size="11.5" text-anchor="middle" fill="#E8E5DE">Node.js</text><rect x="107.5" y="454.27" width="67" height="22" rx="11" fill="none" stroke="#30363D"/><text x="141" y="469.27" class="mono" font-size="11.5" text-anchor="middle" fill="#E8E5DE">Express</text><rect x="182.5" y="454.27" width="67" height="22" rx="11" fill="none" stroke="#30363D"/><text x="216" y="469.27" class="mono" font-size="11.5" text-anchor="middle" fill="#E8E5DE">MongoDB</text><rect x="257.5" y="454.27" width="53" height="22" rx="11" fill="none" stroke="#30363D"/><text x="284" y="469.27" class="mono" font-size="11.5" text-anchor="middle" fill="#E8E5DE">Redis</text><rect x="318.5" y="454.27" width="53" height="22" rx="11" fill="none" stroke="#30363D"/><text x="345" y="469.27" class="mono" font-size="11.5" text-anchor="middle" fill="#E8E5DE">React</text><rect x="379.5" y="454.27" width="60" height="22" rx="11" fill="none" stroke="#30363D"/><text x="409.5" y="469.27" class="mono" font-size="11.5" text-anchor="middle" fill="#E8E5