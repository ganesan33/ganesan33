<svg xmlns="http://www.w3.org/2000/svg" width="880" height="505.77" viewBox="0 0 880 505.77" role="img" aria-labelledby="t d">
<title id="t">EduFlow</title>
<desc id="d">EduFlow (2025–26, Solo). A course platform that turned out to be mostly a video problem. 3 repos, built solo. Pipeline: Upload (Express 5 · Joi) → Queue (BullMQ on Redis) → Worker (ffmpeg, own process) → Blob (source + MP4) → Player (HTTP range); Worker loop: up to 3 tries · exponential backoff. Problem: Course videos are large: processing them inside a web request is slow and fragile, yet playback must seek instantly. Key idea: Uploads go onto a queue; a separate ffmpeg worker transcodes, retries with backoff and records each video’s status. My part: All of it: React web app, Node API, Kotlin Android client, Azure DevOps pipeline to App Service. Stack: Node.js, Express, MongoDB, Redis, React, Kotlin, Azure.</desc>
