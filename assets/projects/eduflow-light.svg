<svg xmlns="http://www.w3.org/2000/svg" width="880" height="112" viewBox="0 0 880 112" role="img" aria-labelledby="t d">
<title id="t">EduFlow: video pipeline</title>
<desc id="d">Five stages: an Express upload API, a BullMQ queue on Redis, an ffmpeg transcoding worker (highlighted) with retries and exponential backoff, Azure Blob Storage, and a player streaming with HTTP range requests.</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}
.mono{font-family:ui-monospace,'SF Mono','Cascadia Mono',Consolas,'Liberation Mono',Menlo,monospace}
@media (max-width:600px){.fine{display:none}}
</style>
<line x1="0" y1="0.5" x2="880" y2="0.5" stroke="#D0D7DE"/>
<text x="0" y="30" class="mono" font-size="11" letter-spacing="1.4" fill="#656D76">01</text>
<line x1="0" y1="42.5" x2="150" y2="42.5" stroke="#D0D7DE" stroke-width="1"/>
<text x="0" y="70" class="mono" font-size="14.5" fill="#1F2328">Upload API</text>
<text x="0" y="95" class="serif" font-size="15" font-style="italic" fill="#656D76">Express 5, Joi</text><path d="M160 38.5 l5 4 l-5 4" fill="none" stroke="#656D76"/>
<text x="176" y="30" class="mono" font-size="11" letter-spacing="1.4" fill="#656D76">02</text>
<line x1="176" y1="42.5" x2="326" y2="42.5" stroke="#D0D7DE" stroke-width="1"/>
<text x="176" y="70" class="mono" font-size="14.5" fill="#1F2328">BullMQ / Redis</text>
<text x="176" y="95" class="serif" font-size="15" font-style="italic" fill="#656D76">3 tries, backoff</text><path d="M336 38.5 l5 4 l-5 4" fill="none" stroke="#656D76"/>
<text x="352" y="30" class="mono" font-size="11" letter-spacing="1.4" fill="#B4531A">03</text>
<line x1="352" y1="42.5" x2="502" y2="42.5" stroke="#B4531A" stroke-width="2"/>
<text x="352" y="70" class="mono" font-size="14.5" fill="#B4531A">ffmpeg worker</text>
<text x="352" y="95" class="serif" font-size="15" font-style="italic" fill="#656D76">out-of-process</text><path d="M512 38.5 l5 4 l-5 4" fill="none" stroke="#656D76"/>
<text x="528" y="30" class="mono" font-size="11" letter-spacing="1.4" fill="#656D76">04</text>
<line x1="528" y1="42.5" x2="678" y2="42.5" stroke="#D0D7DE" stroke-width="1"/>
<text x="528" y="70" class="mono" font-size="14.5" fill="#1F2328">Azure Blob</text>
<text x="528" y="95" class="serif" font-size="15" font-style="italic" fill="#656D76">source + MP4</text><path d="M688 38.5 l5 4 l-5 4" fill="none" stroke="#656D76"/>
<text x="704" y="30" class="mono" font-size="11" letter-spacing="1.4" fill="#656D76">05</text>
<line x1="704" y1="42.5" x2="854" y2="42.5" stroke="#D0D7DE" stroke-width="1"/>
<text x="704" y="70" class="mono" font-size="14.5" fill="#1F2328">Player</text>
<text x="704" y="95" class="serif" font-size="15" font-style="italic" fill="#656D76">HTTP 206 seeking</text>
</svg>
