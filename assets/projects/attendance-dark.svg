<svg xmlns="http://www.w3.org/2000/svg" width="880" height="526.36" viewBox="0 0 880 526.36" role="img" aria-labelledby="t d">
<title id="t">Smart Attendance</title>
<desc id="d">Smart Attendance (2026, Team of two). Face or rotating-QR attendance that a photo on a phone cannot fool. 25–34× faster on GPU. Pipeline: BlazeFace (in the browser) → Detect (SCRFD on GPU) → ArcFace (512-d match) → Liveness (4 checks + 2 models) → Record (integrity score); Liveness loop: 3 frames in a row · any fail resets. Problem: Roll calls and sign-in sheets are easy to proxy, and a face held up on a phone is still a face. Key idea: A match only counts after liveness passes on three frames in a row: four OpenCV checks run in parallel with two MiniFASNet models. My part: Backend, recognition and anti-spoofing pipeline, analytics and benchmarks. A teammate built the QR flow. Stack: Django, PostgreSQL, InsightFace, ONNX Runtime, OpenCV, React.</desc>
