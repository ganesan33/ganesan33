="mono" font-size="13.5" text-anchor="middle" fill="#E8E5DE">ArcFace</text><text x="440" y="282" class="serif" font-size="13" font-style="italic" text-anchor="middle" fill="#8B949E">512-d match</text><line x1="500" y1="238.5" x2="551" y2="238.5" stroke="#8B949E"/><path d="M550 234.5 L557 238.5 L550 242.5z" fill="#8B949E"/><text x="528.5" y="231" class="mono" font-size="10.5" text-anchor="middle" fill="#8B949E">student</text><rect x="563.5" y="218.5" width="107" height="39" rx="8" fill="rgba(240,160,75,0.10)" stroke="#F0A04B"/><text x="617" y="243" class="mono" font-size="13.5" text-anchor="middle" fill="#F0A04B">Liveness</text><text x="617" y="282" class="serif" font-size="13" font-style="italic" text-anchor="middle" fill="#8B949E">4 checks + 2 models</text><line x1="677" y1="238.5" x2="728" y2="238.5" stroke="#8B949E"/><path d="M727 234.5 L734 238.5 L727 242.5z" fill="#8B949E"/><text x="705.5" y="231" class="mono" font-size="10.5" text-anchor="middle" fill="#8B949E">present</text><path d="M649 218 C649 188 585 188 585 212" fill="none" stroke="#F0A04B"/><path d="M581 209 L585 218 L589 209z" fill="#F0A04B"/><text x="617" y="184" class="mono" font-size="10.5" text-anchor="middle" fill="#F0A04B">3 frames in a row · any fail resets</text><rect x="740.5" y="218.5" width="107" height="39" rx="8" fill="none" stroke="#30363D"/><text x="794" y="243" class="mono" font-size="13.5" text-anchor="middle" fill="#E8E5DE">Record</text><text x="794" y="282" class="serif" font-size="13" font-style="italic" text-anchor="middle" fill="#8B949E">integrity score</text><line x1="32" y1="306.5" x2="848" y2="306.5" stroke="#30363D"/><text x="32" y="336" class="mono" font-size="11" letter-spacing="1.6" text-anchor="start" fill="#8B949E">PROBLEM</text><text x="32" y="362" class="serif" font-size="14.5" fill="#E8E5DE" ><tspan x="32" dy="0">Roll calls and sign-in sheets are</tspan><tspan x="32" dy="20.59">easy to proxy, and a face held up</tspan><tspan x="32" dy="20.59">on a phone is still a face.</tspan></text><text x="312" y="336" class="mono" font-size="11" letter-spacing="1.6" text-anchor="start" fill="#F0A04B">KEY IDEA</text><text x="312" y="362" class="serif" font-size="14.5" fill="#E8E5DE" ><tspan x="312" dy="0">A match only counts after</tspan><tspan x="312" dy="20.59">liveness passes on three frames</tspan><tspan x="312" dy="20.59">in a row: four OpenCV checks run</tspan><tspan x="312" dy="20.59">in parallel with two MiniFASNet</tspan><tspan x="312" dy="20.59">models.</tspan></text><text x="592" y="336" class="mono" font-size="11" letter-spacing="1.6" text-anchor="start" fill="#8B949E">MY PART</text><text x="592" y="362" class="serif" font-size="14.5" fill="#E8E5DE" ><tspan x="592" dy="0">Backend, recognition and</tspan><tspan x="592" dy="20.59">anti-spoofing pipeline, analytics</tspan><tspan x="592" dy="20.59">and benchmarks. A teammate built</tspan><tspan x="592" dy="20.59">the QR flow.</tspan></text><rect x="32.5" y="474.86" width="60" height="22" rx="11" fill="none" stroke="#30363D"/><text x="62.5" y="489.86" class="mono" font-size="11.5" text-anchor="middle" fill="#E8E5DE">Django</text><rect x="100.5" y="474.86" width="88" height="22" rx="11" fill="none" stroke="#30363D"/><text x="144.5" y="489.86" class="mono" font-size="11.5" text-anchor="middle" fill="#E8E5DE">PostgreSQL</text><rect x="196.5" y="474.86" width="95" height="22" rx="11" fill="none" stroke="#30363D"/><text x="244" y="489.86" class="mono" font-size="11.5" text-anchor="middle" fill="#E8E5DE">InsightFace</text><rect x="299.5" y="474.86" width="102" height="22" rx="11" fill="none" stroke="#30363D"/><text x="350.5" y="489.86" class="mono" font-size="11.5" text-anchor="middle" fill="#E8E5DE">ONNX Runtime</text><rect x="409.5" y="474.86" width="60" height="22" rx="11" fill="none" stroke="#30363D"/><text x="439.5" y="489.86" class="mono" font-size="11.5" text-anchor="middle" fill="#E8E5DE">OpenCV</text><rect x="477.5" y="474.86" width="53" height="22" rx="11" fill="none" stroke="#30363D"/><text x="504" y="489.86" class="mono" font-size="11.5" text-anchor="middle" fill="#E8E5DE">React</text><text x="848" y="489.36" class="mono" font-size="11" letter-spacing="1.6" text-anchor="end" fill="#8B949E">PRIVATE REPOSITORY</text></g><g class="compact">
