<svg xmlns="http://www.w3.org/2000/svg" width="880" height="112" viewBox="0 0 880 112" role="img" aria-labelledby="t d">
<title id="t">Smart Attendance: face check-in pipeline</title>
<desc id="d">Five stages: an in-browser BlazeFace gate at the kiosk, face detection on the GPU, an ArcFace 512-dimensional embedding match, liveness checks combining four OpenCV heuristics with two MiniFASNet models (highlighted), and an attendance record with an integrity score.</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}
.mono{font-family:ui-monospace,'SF Mono','Cascadia Mono',Consolas,'Liberation Mono',Menlo,monospace}
@media (max-width:600px){.fine{display:none}}
</style>
<line x1="0" y1="0.5" x2="880" y2="0.5" stroke="#30363D"/>
<text x="0" y="30" class="mono" font-size="11" letter-spacing="1.4" fill="#8B949E">01</text>
<line x1="0" y1="42.5" x2="150" y2="42.5" stroke="#30363D" stroke-width="1"/>
<text x="0" y="70" class="mono" font-size="14.5" fill="#E8E5DE">BlazeFace gate</text>
<text x="0" y="95" class="serif" font-size="15" font-style="italic" fill="#8B949E">in the browser</text><path d="M160 38.5 l5 4 l-5 4" fill="none" stroke="#8B949E"/>
<text x="176" y="30" class="mono" font-size="11" letter-spacing="1.4" fill="#8B949E">02</text>
<line x1="176" y1="42.5" x2="326" y2="42.5" stroke="#30363D" stroke-width="1"/>
<text x="176" y="70" class="mono" font-size="14.5" fill="#E8E5DE">Face detection</text>
<text x="176" y="95" class="serif" font-size="15" font-style="italic" fill="#8B949E">GPU, ONNX Runtime</text><path d="M336 38.5 l5 4 l-5 4" fill="none" stroke="#8B949E"/>
<text x="352" y="30" class="mono" font-size="11" letter-spacing="1.4" fill="#8B949E">03</text>
<line x1="352" y1="42.5" x2="502" y2="42.5" stroke="#30363D" stroke-width="1"/>
<text x="352" y="70" class="mono" font-size="14.5" fill="#E8E5DE">ArcFace match</text>
<text x="352" y="95" class="serif" font-size="15" font-style="italic" fill="#8B949E">512-d embeddings</text><path d="M512 38.5 l5 4 l-5 4" fill="none" stroke="#8B949E"/>
<text x="528" y="30" class="mono" font-size="11" letter-spacing="1.4" fill="#F0A04B">04</text>
<line x1="528" y1="42.5" x2="678" y2="42.5" stroke="#F0A04B" stroke-width="2"/>
<text x="528" y="70" class="mono" font-size="14.5" fill="#F0A04B">Liveness</text>
<text x="528" y="95" class="serif" font-size="15" font-style="italic" fill="#8B949E">4 checks + 2 models</text><path d="M688 38.5 l5 4 l-5 4" fill="none" stroke="#8B949E"/>
<text x="704" y="30" class="mono" font-size="11" letter-spacing="1.4" fill="#8B949E">05</text>
<line x1="704" y1="42.5" x2="854" y2="42.5" stroke="#30363D" stroke-width="1"/>
<text x="704" y="70" class="mono" font-size="14.5" fill="#E8E5DE">Attendance</text>
<text x="704" y="95" class="serif" font-size="15" font-style="italic" fill="#8B949E">with integrity score</text>
</svg>
