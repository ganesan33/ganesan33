<svg xmlns="http://www.w3.org/2000/svg" width="880" height="505.77" viewBox="0 0 880 505.77" role="img" aria-labelledby="t d">
<title id="t">Fraud investigation agent</title>
<desc id="d">Fraud investigation agent (2026, Team of three). An LLM investigates disputed payments; a rule engine makes the call. R1–R10 rules decide. Pipeline: Traverse (TigerGraph hops) → Evidence (case-scoped) → LLM (proposes) → Rules (R1–R10 decide) → Verdict (SAR + audit). Problem: Analysts piece fraud cases together by hand from cards, devices, regions and earlier cases. Key idea: The model never gets the last word: deterministic policy rules set the verdict, so every outcome traces to a named rule. My part: The first FastAPI backend, and the R1–R10 rule engine with its registry and unit tests. Stack: Python, FastAPI, TigerGraph, Groq, React, TypeScript.</desc>
