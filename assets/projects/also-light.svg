<svg xmlns="http://www.w3.org/2000/svg" width="880" height="232" viewBox="0 0 880 232" role="img" aria-labelledby="t d">
<title id="t">Also</title>
<desc id="d">StockSense (2026 · Team of four). Inventory where every stock change is a signed ledger entry, and only validation posts stock. I built receipts, an operation-summary endpoint, and most of the operations UI. A CSRF fix upstream (2026 · Open source · Merged). django-modern-rest’s OpenAPI schema declared the CSRF cookie but not the header Django checks. I added the header scheme across its cookie-auth classes.</desc>
