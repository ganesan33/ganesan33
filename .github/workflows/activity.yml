# Redraws assets/activity/rhythm-{dark,light}.svg from GitHub's own data
# and commits them only when the picture actually changed.
# Uses the built-in GITHUB_TOKEN (read public data, write this repo). No PAT.
name: Contribution rhythm

on:
  schedule:
    - cron: "30 2 * * *" # daily, 08:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Draw
        run: node scripts/build-activity.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git add assets/activity README.md
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(activity): redraw contribution rhythm"
          git push
